<!DOCTYPE html>
<html lang="bn" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mission DMC Dashboard</title>
    <style>
        /* --- Premium Compact Variables --- */
        :root {
            --bg-color: #050505; --card-bg: #121212; --border-color: #1f1f1f;
            --text-main: #ffffff; --text-muted: #888888;
            --accent-color: #00e676; --danger-color: #ff3d00;
            --warning-color: #ffea00; --info-color: #00e5ff;
            --rev-color: #b388ff; --input-bg: #1a1a1a;
            --overall-grad: linear-gradient(135deg, #102a45 0%, #174272 100%);
        }

        [data-theme="light"] {
            --bg-color: #eef0f3; --card-bg: #ffffff; --border-color: #d1d5db;
            --text-main: #1f2937; --text-muted: #6b7280;
            --accent-color: #10b981; --danger-color: #ef4444;
            --warning-color: #f59e0b; --info-color: #0ea5e9;
            --rev-color: #6366f1; --input-bg: #f9fafb;
            --overall-grad: linear-gradient(135deg, #2b70b5 0%, #36556f 100%);
        }

        * { box-sizing: border-box; }
        body { background: var(--bg-color); color: var(--text-main); font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; padding: 15px; transition: 0.3s ease; }
        
        /* Main Layout Grid */
        .container { max-width: 1250px; margin: 0 auto; }
        .main-layout { display: flex; flex-direction: column; gap: 20px; }
        
        @media (min-width: 992px) {
            .main-layout { display: grid; grid-template-columns: 380px 1fr; align-items: flex-start; }
            body { padding: 25px; }
        }

        /* --- Global Compact Styles --- */
        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 15px; }
        
        /* --- Header --- */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .header h1 { margin: 0; font-size: 18px; font-weight: 700; color: var(--text-main); }
        .header p { margin: 2px 0 0; font-size: 12px; color: var(--text-muted); }
        .theme-toggle { background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-main); width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 14px; transition: 0.3s; }
        .theme-toggle:hover { transform: scale(1.1); border-color: var(--accent-color); }

        /* --- Overall Progress (Compact) --- */
        .overall-card { background: var(--overall-grad); border-radius: 12px; padding: 20px 15px; text-align: center; color: #fff; margin-bottom: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .overall-title { font-size: 15px; font-weight: 600; margin-bottom: 5px; }
        .overall-val-container { font-size: 42px; font-weight: 800; margin-bottom: 10px; letter-spacing: -1px; }
        .overall-bar-bg { background: rgba(255, 255, 255, 0.2); height: 8px; border-radius: 8px; width: 85%; margin: 0 auto; overflow: hidden; }
        .overall-bar-fill { background: #00ff88; height: 100%; width: 0%; border-radius: 8px; transition: width 1s; }
        .target-note { font-size: 11px; margin-top: 10px; opacity: 0.9; background: rgba(0,0,0,0.2); padding: 4px 10px; border-radius: 15px; display: inline-block;}

        /* --- Mini Stats & Timer --- */
        .mini-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .m-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 10px; text-align: center; }
        .m-title { font-size: 11px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; margin-bottom: 4px;}
        .m-val { font-size: 16px; font-weight: 800; color: var(--text-main); }
        
        /* Timer block taking full width in grid */
        .timer-block { grid-column: span 2; display: flex; justify-content: space-between; align-items: center; }
        .timer-block .m-val { font-size: 20px; color: var(--warning-color); }
        .timer-btns { display: flex; gap: 5px; }
        .timer-btn { background: var(--input-bg); border: 1px solid var(--border-color); color: var(--text-main); padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: bold; }

        /* --- Notes --- */
        .notes-section { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; padding: 10px 12px; }
        .notes-input { flex: 1; background: transparent; border: none; color: var(--text-main); font-size: 13px; outline: none; border-bottom: 1px dashed var(--border-color); }
        .notes-input:focus { border-bottom-color: var(--accent-color); }

        /* --- Summary Grid --- */
        .summary-card { margin-bottom: 10px; padding: 12px; }
        .summary-card h3 { margin: 0 0 10px 0; font-size: 14px; font-weight: 600; border-bottom: 1px solid var(--border-color); padding-bottom: 6px;}
        .paper-row { margin-bottom: 10px; }
        .paper-row:last-child { margin-bottom: 0; }
        .paper-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        .paper-name { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
        .target-toggle { cursor: pointer; font-size: 12px; opacity: 0.5; transition: 0.3s; }
        .target-toggle.active { opacity: 1; color: var(--accent-color); }
        .rev-badge { background: var(--input-bg); color: var(--text-muted); font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 8px; border: 1px solid var(--border-color); }
        .paper-bar-container { display: flex; align-items: center; gap: 8px; }
        .paper-bar-bg { flex: 1; background: var(--input-bg); height: 6px; border-radius: 4px; overflow: hidden; border: 1px solid var(--border-color); }
        .paper-bar-fill { background: var(--accent-color); height: 100%; width: 0%; transition: 0.8s; }
        .paper-percent { font-size: 11px; font-weight: 700; color: var(--accent-color); width: 25px; text-align: right; }
        .paper-excluded { opacity: 0.4; filter: grayscale(1); }

        /* --- Right Panel: Tabs & Details --- */
        .tabs { display: flex; flex-wrap: nowrap; overflow-x: auto; gap: 6px; margin-bottom: 15px; padding-bottom: 5px; scrollbar-width: none;}
        .tabs::-webkit-scrollbar { display: none; }
        .tab-btn { background: var(--card-bg); color: var(--text-muted); border: 1px solid var(--border-color); padding: 6px 12px; border-radius: 20px; cursor: pointer; font-weight: 600; font-size: 12px; flex-shrink: 0; }
        .tab-btn.active { background: var(--accent-color); color: #000; border-color: var(--accent-color); }

        .subject-content { display: none; }
        .subject-content.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .subject-controls { display: flex; justify-content: space-between; align-items: center; background: var(--input-bg); padding: 8px 12px; border-radius: 8px; margin-bottom: 12px; font-size: 12px; border: 1px solid var(--border-color); }
        .add-topic-btn { background: var(--info-color); color: #000; border: none; padding: 4px 10px; border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 11px; }

        /* Compact Chapter List */
        .chapter-list { list-style: none; padding: 0; margin: 0; }
        .chapter-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border-color); gap: 10px; }
        .chapter-item:last-child { border-bottom: none; }
        
        .chapter-info { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 150px;}
        .star-btn { cursor: pointer; font-size: 14px; opacity: 0.3; filter: grayscale(1); }
        .star-btn.active { opacity: 1; filter: grayscale(0); }
        .chapter-name { font-size: 13px; font-weight: 600; line-height: 1.3;}
        .chapter-name.hard-topic { color: var(--danger-color); }

        /* Compact Actions (Rev + Select) */
        .chapter-action { display: flex; align-items: center; gap: 6px; }
        
        .rev-control { display: flex; align-items: center; background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 6px; height: 26px; }
        .rev-btn { background: transparent; border: none; color: var(--text-muted); padding: 0 6px; cursor: pointer; font-weight: bold; font-size: 12px; }
        .rev-btn:hover { color: var(--rev-color); }
        .rev-count { font-size: 10px; font-weight: 700; color: var(--text-main); min-width: 45px; text-align: center; }
        .rev-count.active { color: var(--rev-color); }

        select.status-select {
            appearance: none; height: 26px; background: var(--input-bg); color: var(--text-main);
            border: 1px solid var(--border-color); padding: 0 20px 0 8px; border-radius: 6px; cursor: pointer; outline: none; font-weight: 700; font-size: 11px;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23888888' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat; background-position: right 4px center; background-size: 10px;
        }

        .reset-btn { width: 100%; margin-top: 20px; background: transparent; color: var(--danger-color); border: 1px dashed var(--danger-color); padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 12px;}
        
        /* Make chapter items stack slightly on very small phones, but stay inline mostly */
        @media (max-width: 480px) {
            .chapter-item { flex-direction: column; align-items: flex-start; background: var(--card-bg); padding: 12px; border-radius: 8px; margin-bottom: 8px; border: 1px solid var(--border-color);}
            .chapter-action { width: 100%; justify-content: space-between; margin-top: 5px; }
            select.status-select { flex: 1; }
        }

    </style>
</head>
<body>

<div class="container">
    <div class="main-layout">
        
        <!-- ================= LEFT PANEL (Dashboard) ================= -->
        <div class="left-panel">
            
            <div class="header">
                <div>
                    <h1>Mission DMC Tracker</h1>
                    <p>Compact Dashboard & Revision</p>
                </div>
                <button class="theme-toggle" id="theme-btn" onclick="toggleTheme()">☀️</button>
            </div>

            <div class="card notes-section">
                <span>📌</span>
                <input type="text" id="daily-note" class="notes-input" placeholder="আজকের টার্গেট এখানে লিখুন..." oninput="saveNote()">
            </div>

            <div class="overall-card">
                <div class="overall-title">Targeted Syllabus Progress</div>
                <div class="overall-val-container"><span id="overall-val">0</span>%</div>
                <div class="overall-bar-bg"><div class="overall-bar-fill" id="overall-bar"></div></div>
                <div class="target-note">🎯 Excluding untargeted subjects</div>
            </div>

            <div class="mini-stats">
                <div class="m-card">
                    <div class="m-title">Deadline</div>
                    <div class="m-val" id="syl-countdown" style="color: var(--accent-color);">-- d</div>
                </div>
                <div class="m-card">
                    <div class="m-title">Speed Required</div>
                    <div class="m-val" id="speed-active" style="color: var(--info-color);">-- ch/d</div>
                </div>
                <div class="m-card timer-block">
                    <div>
                        <div class="m-title" style="text-align: left;">Focus Timer</div>
                        <div class="m-val" id="timer-display">25:00</div>
                    </div>
                    <div class="timer-btns">
                        <button class="timer-btn" onclick="startTimer()">Start</button>
                        <button class="timer-btn" onclick="resetTimer()">Reset</button>
                    </div>
                </div>
            </div>

            <div id="summary-grid">
                <!-- Auto Generated Summary -->
            </div>
            
            <!-- Hide Reset on Desktop Left Panel, show on Mobile bottom or via Setting -->
            <button class="reset-btn" onclick="resetData()">🗑️ Reset All Data</button>
        </div>


        <!-- ================= RIGHT PANEL (Details) ================= -->
        <div class="right-panel card">
            <div class="tabs" id="tabs-container"></div>
            <div id="content-container"></div>
        </div>

    </div>
</div>

<!-- Scripts -->
<script>
    // Theme
    let currentTheme = localStorage.getItem('missionDmcTheme') || 'light';
    document.documentElement.setAttribute('data-theme', currentTheme);
    document.getElementById('theme-btn').innerText = currentTheme === 'dark' ? '☀️' : '🌙';
    function toggleTheme() {
        currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', currentTheme);
        localStorage.setItem('missionDmcTheme', currentTheme);
        document.getElementById('theme-btn').innerText = currentTheme === 'dark' ? '☀️' : '🌙';
    }

    // Timer
    let timerInterval; let timeLeft = 25 * 60; let isTimerRunning = false;
    function updateTimerDisplay() { document.getElementById('timer-display').innerText = `${Math.floor(timeLeft / 60).toString().padStart(2, '0')}:${(timeLeft % 60).toString().padStart(2, '0')}`; }
    function startTimer() {
        if (!isTimerRunning) {
            isTimerRunning = true;
            timerInterval = setInterval(() => {
                if (timeLeft > 0) { timeLeft--; updateTimerDisplay(); } 
                else { clearInterval(timerInterval); isTimerRunning = false; alert("২৫ মিনিট শেষ! ব্রেক নাও ☕"); timeLeft = 25 * 60; updateTimerDisplay(); }
            }, 1000);
        } else {
            clearInterval(timerInterval); isTimerRunning = false; // Pause if clicked again
        }
    }
    function resetTimer() { clearInterval(timerInterval); isTimerRunning = false; timeLeft = 25 * 60; updateTimerDisplay(); }

    // Data 
    const groups = [
        { id: 'bio', title: 'Biology', papers: [{id:'bio1', name:'Botany (Paper I)'}, {id:'bio2', name:'Zoology (Paper II)'}] },
        { id: 'chem', title: 'Chemistry', papers: [{id:'chem1', name:'Chemistry (Paper I)'}, {id:'chem2', name:'Chemistry (Paper II)'}] },
        { id: 'phy', title: 'Physics', papers: [{id:'physics1', name:'Physics (Paper I)'}, {id:'physics2', name:'Physics (Paper II)'}] },
        { id: 'math', title: 'Mathematics', papers: [{id:'math1', name:'Math (Paper I)'}, {id:'math2', name:'Math (Paper II)'}] },
        { id: 'med', title: 'Medical Prep', papers: [{id:'medEng', name:'English'}, {id:'medGK', name:'GK'}] }
    ];

    const defaultSyllabus = {
        "physics1": { name: "Phy 1st", chapters: ["ভৌতজগৎ", "ভেক্টর", "গতিবিদ্যা", "নিউটনিয়ান বলবিদ্যা", "কাজ, শক্তি", "মহাকর্ষ", "পদার্থের গাঠনিক ধর্ম", "পর্যাবৃত্ত গতি", "তরঙ্গ", "আদর্শ গ্যাস"] },
        "physics2": { name: "Phy 2nd", chapters: ["তাপগতিবিদ্যা", "স্থির তড়িৎ", "চল তড়িৎ", "চৌম্বক ক্রিয়া", "আবেশ", "জ্যামিতিক আলোক", "ভৌত আলোক", "আধুনিক পদার্থবিজ্ঞান", "পরমাণু ও নিউক্লিয়ার", "সেমিকন্ডাক্টর", "জ্যোতির্বিজ্ঞান"] },
        "chem1": { name: "Chem 1st", chapters: ["ল্যাবরেটরি", "গুণগত রসায়ন", "মৌলের পর্যায়বৃত্ত ধর্ম", "রাসায়নিক পরিবর্তন", "কর্মমুখী রসায়ন"] },
        "chem2": { name: "Chem 2nd", chapters: ["পরিবেশ রসায়ন", "জৈব রসায়ন", "পরিমাণগত রসায়ন", "তড়িৎ রসায়ন", "অর্থনৈতিক রসায়ন"] },
        "math1": { name: "Math 1st", chapters: ["ম্যাট্রিক্স", "ভেক্টর", "সরলরেখা", "বৃত্ত", "বিন্যাস-সমাবেশ", "ত্রিকোণমিতিক অনুপাত", "সংযুক্ত কোণ", "ফাংশন", "অন্তরীকরণ", "যোগজীকরণ"] },
        "math2": { name: "Math 2nd", chapters: ["বাস্তব সংখ্যা", "যোগাশ্রয়ী", "জটিল সংখ্যা", "বহুপদী", "দ্বিপদী বিস্তৃতি", "কনিক", "বিপরীত ত্রিকোণমিতিক", "স্থিতিবিদ্যা", "সমতলে বস্তুকণা", "বিস্তার পরিমাপ"] },
        "bio1": { name: "Botany", chapters: ["কোষ", "কোষ বিভাজন", "কোষ রসায়ন", "অণুজীব", "শৈবাল-ছত্রাক", "ব্রায়োফাইটা", "নগ্নবীজী", "টিস্যু", "উদ্ভিদ শারীরতত্ত্ব", "উদ্ভিদ প্রজনন", "জীবপ্রযুক্তি", "পরিবেশ"] },
        "bio2": { name: "Zoology", chapters: ["প্রাণীর শ্রেণিবিন্যাস", "প্রাণীর পরিচিতি", "পরিপাক", "রক্ত ও সঞ্চালন", "শ্বাসক্রিয়া", "বর্জ্য ও নিষ্কাশন", "চলন", "স্নায়বিক সমন্বয়", "ধারাবাহিকতা", "প্রতিরক্ষা", "জিনতত্ত্ব", "আচরণ"] },
        "medEng": { name: "English", chapters: ["Parts of Speech", "Tense", "Right Forms", "Voice", "Narration", "Correction", "Synonym-Antonym", "Spelling", "Phrases", "Preposition"] },
        "medGK": { name: "GK", chapters: ["প্রাচীন বাংলা", "ভাষা আন্দোলন", "মুক্তিযুদ্ধ", "সংবিধান", "অর্থনীতি", "সংস্কৃতি", "আন্তর্জাতিক"] }
    };

    let customChapters = JSON.parse(localStorage.getItem('missionDmcCustomChapters')) || { medEng: [], medGK: [] };
    defaultSyllabus.medEng.chapters.push(...customChapters.medEng);
    defaultSyllabus.medGK.chapters.push(...customChapters.medGK);
    const syllabusData = defaultSyllabus;

    let excludedSubjects = JSON.parse(localStorage.getItem('missionDmcExcluded')) || [];
    let savedProgress = JSON.parse(localStorage.getItem('missionDmcProgressV3')) || {};
    const syllabusDeadline = new Date(`October 31, 2026 23:59:59`).getTime();

    document.getElementById('daily-note').value = localStorage.getItem('missionDmcNote') || "";

    function getRevText(num) { return num === 0 ? 'Rev 0' : `Rev ${num}`; }
    function getColor(val) { return val == 0 ? 'var(--danger-color)' : val == 25 ? 'var(--warning-color)' : val == 50 ? '#aaaa00' : val == 75 ? 'var(--info-color)' : 'var(--accent-color)'; }

    function buildUI() {
        const summaryGrid = document.getElementById('summary-grid');
        summaryGrid.innerHTML = '';
        
        groups.forEach(group => {
            let cardHtml = `<div class="card summary-card"><h3>${group.title}</h3>`;
            group.papers.forEach(paper => {
                const subId = paper.id; const subjData = syllabusData[subId]; const isTargeted = !excludedSubjects.includes(subId);
                let totalCh = subjData.chapters.length; let compCh = 0; let totalRevs = 0;
                subjData.chapters.forEach((_, i) => { let c = savedProgress[`${subId}-ch-${i}`] || {val:0, rev:0}; compCh += (c.val / 100); totalRevs += c.rev; });
                let percent = totalCh > 0 ? Math.round((compCh / totalCh) * 100) : 0;
                let avgRev = totalCh > 0 ? Math.floor(totalRevs / totalCh) : 0;

                cardHtml += `
                    <div class="paper-row ${isTargeted ? '' : 'paper-excluded'}">
                        <div class="paper-header">
                            <div class="paper-name"><span class="target-toggle ${isTargeted ? 'active' : ''}" onclick="toggleTarget('${subId}')">${isTargeted ? '🎯' : '⭕'}</span>${paper.name}</div>
                            <div class="rev-badge">${getRevText(avgRev)}</div>
                        </div>
                        <div class="paper-bar-container">
                            <div class="paper-bar-bg"><div class="paper-bar-fill" style="width: ${percent}%;"></div></div>
                            <div class="paper-percent">${percent}%</div>
                        </div>
                    </div>`;
            });
            summaryGrid.innerHTML += cardHtml + `</div>`;
        });

        const tabsContainer = document.getElementById('tabs-container');
        const contentContainer = document.getElementById('content-container');
        tabsContainer.innerHTML = ''; contentContainer.innerHTML = '';

        let isFirst = true;
        for (const [key, subject] of Object.entries(syllabusData)) {
            const btn = document.createElement('button');
            btn.className = `tab-btn ${isFirst ? 'active' : ''}`;
            btn.innerText = subject.name; btn.onclick = () => switchTab(key);
            tabsContainer.appendChild(btn);

            const contentDiv = document.createElement('div');
            contentDiv.className = `subject-content ${isFirst ? 'active' : ''}`;
            contentDiv.id = `content-${key}`;

            let headerHtml = `<div class="subject-controls">
                <span><input type="checkbox" onchange="toggleExcludeBox('${key}', this)" ${excludedSubjects.includes(key) ? 'checked' : ''}> Target থেকে বাদ দিন</span>
                ${(key === 'medEng' || key === 'medGK') ? `<button class="add-topic-btn" onclick="addCustomChapter('${key}')">+ Add</button>` : ''}
            </div>`;

            let chaptersHtml = '';
            subject.chapters.forEach((chapter, index) => {
                const chapterId = `${key}-ch-${index}`;
                const cData = savedProgress[chapterId] || { val: 0, star: false, rev: 0 };
                chaptersHtml += `
                    <li class="chapter-item">
                        <div class="chapter-info">
                            <span class="star-btn ${cData.star ? 'active' : ''}" onclick="toggleStar('${chapterId}', this)">⭐</span>
                            <span class="chapter-name ${cData.star ? 'hard-topic' : ''}" id="name-${chapterId}">${chapter}</span>
                        </div>
                        <div class="chapter-action">
                            <div class="rev-control">
                                <button class="rev-btn" onclick="changeRev('${chapterId}', -1)">-</button>
                                <span class="rev-count ${cData.rev > 0 ? 'active' : ''}" id="rev-${chapterId}">${getRevText(cData.rev)}</span>
                                <button class="rev-btn" onclick="changeRev('${chapterId}', 1)">+</button>
                            </div>
                            <select class="status-select" id="${chapterId}" onchange="updateProg('${key}', '${chapterId}', this)" style="color: ${getColor(cData.val)}">
                                <option value="0" ${cData.val == 0 ? 'selected' : ''}>0%</option>
                                <option value="25" ${cData.val == 25 ? 'selected' : ''}>25%</option>
                                <option value="50" ${cData.val == 50 ? 'selected' : ''}>50%</option>
                                <option value="75" ${cData.val == 75 ? 'selected' : ''}>75%</option>
                                <option value="100" ${cData.val == 100 ? 'selected' : ''}>100%</option>
                            </select>
                        </div>
                    </li>`;
            });

            contentDiv.innerHTML = headerHtml + `<ul class="chapter-list">${chaptersHtml}</ul>`;
            contentContainer.appendChild(contentDiv);
            isFirst = false;
        }
    }

    function switchTab(activeKey) {
        document.querySelectorAll('.tab-btn').forEach(btn => { btn.classList.remove('active'); if (btn.innerText === syllabusData[activeKey].name) btn.classList.add('active'); });
        document.querySelectorAll('.subject-content').forEach(content => content.classList.remove('active'));
        document.getElementById(`content-${activeKey}`).classList.add('active');
    }

    function saveNote() { localStorage.setItem('missionDmcNote', document.getElementById('daily-note').value); }
    
    function addCustomChapter(subjectKey) {
        let topic = prompt("New Topic Name:");
        if(topic && topic.trim() !== "") { customChapters[subjectKey].push(topic.trim()); localStorage.setItem('missionDmcCustomChapters', JSON.stringify(customChapters)); location.reload(); }
    }

    function toggleTarget(subjectKey) {
        if(excludedSubjects.includes(subjectKey)) excludedSubjects = excludedSubjects.filter(item => item !== subjectKey);
        else excludedSubjects.push(subjectKey);
        localStorage.setItem('missionDmcExcluded', JSON.stringify(excludedSubjects)); refreshAll();
    }
    
    function toggleExcludeBox(subjectKey, cb) { toggleTarget(subjectKey); }

    function toggleStar(chapterId, el) {
        if(!savedProgress[chapterId]) savedProgress[chapterId] = { val:0, star:false, rev:0 };
        savedProgress[chapterId].star = !savedProgress[chapterId].star;
        localStorage.setItem('missionDmcProgressV3', JSON.stringify(savedProgress));
        el.classList.toggle('active'); document.getElementById(`name-${chapterId}`).classList.toggle('hard-topic');
    }

    function changeRev(chapterId, amount) {
        if(!savedProgress[chapterId]) savedProgress[chapterId] = { val:0, star:false, rev:0 };
        let newRev = Math.max(0, (savedProgress[chapterId].rev || 0) + amount);
        savedProgress[chapterId].rev = newRev;
        localStorage.setItem('missionDmcProgressV3', JSON.stringify(savedProgress));
        refreshAll();
    }

    function updateProg(subjectKey, chapterId, selectElement) {
        if(!savedProgress[chapterId]) savedProgress[chapterId] = { val:0, star:false, rev:0 };
        savedProgress[chapterId].val = parseInt(selectElement.value);
        localStorage.setItem('missionDmcProgressV3', JSON.stringify(savedProgress));
        selectElement.style.color = getColor(selectElement.value);
        refreshAll();
    }

    function calculateMasterProgress() {
        let activeTotal = 0; let activeCompleted = 0;
        for (const [key, subject] of Object.entries(syllabusData)) {
            if(!excludedSubjects.includes(key)) {
                activeTotal += subject.chapters.length;
                subject.chapters.forEach((_, index) => { let c = savedProgress[`${key}-ch-${index}`]; if(c) activeCompleted += (c.val / 100); });
            }
        }
        const overallPercent = activeTotal > 0 ? Math.round((activeCompleted / activeTotal) * 100) : 0;
        document.getElementById('overall-val').innerText = overallPercent;
        document.getElementById('overall-bar').style.width = `${overallPercent}%`;

        const daysLeft = Math.ceil((syllabusDeadline - new Date().getTime()) / (1000 * 60 * 60 * 24));
        document.getElementById('syl-countdown').innerText = daysLeft > 0 ? `${daysLeft} d` : "End";
        let remainActive = activeTotal - activeCompleted;
        document.getElementById('speed-active').innerText = (daysLeft > 0 && remainActive > 0) ? (remainActive / daysLeft).toFixed(1) + " ch/d" : "Done";
    }

    function refreshAll() {
        buildUI(); calculateMasterProgress();
        // keep selected tab active
        const activeBtn = document.querySelector('.tab-btn.active');
        if(activeBtn) {
            let foundKey = Object.keys(syllabusData).find(k => syllabusData[k].name === activeBtn.innerText);
            if(foundKey) switchTab(foundKey);
        }
    }

    function resetData() { if(confirm("Are you sure to delete all progress?")) { localStorage.clear(); location.reload(); } }

    buildUI(); calculateMasterProgress(); updateTimerDisplay();
</script>
</body>
</html>
